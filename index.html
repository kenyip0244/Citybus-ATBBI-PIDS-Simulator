<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aberdeen Tunnel BBI PIDS Simulator</title>
  <!-- 引入 Roboto 字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ctb-blue-bg: #0033cc;
      --route-bg: #1a36e8;
      --bg-gradient-top: #dceafc;
      --bg-gradient-bottom: #f2f7ff;
      --text-blue: #003399;
      --gps-orange: #f27224;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Arial", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
    }

    #app-wrapper {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * 16 / 9);
      max-height: calc(100vw * 9 / 16);
      container-type: size;
      position: relative;
      overflow: hidden;
      background: var(--ctb-blue-bg);
    }

    /* 共用的頂部和底部留空長條 (主頁與PIDS共用) */
    .header {
      height: 6%;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 1.5cqw;
      font-size: 1.2cqw;
      font-weight: normal;
      letter-spacing: 0.05cqw;
      cursor: pointer;
    }

    .empty-ticker {
      height: 6%;
      background: transparent;
      width: 100%;
    }

    /* 共用的中央面板 (主頁與PIDS共用) */
    .panel-content {
      flex: 1;
      background: linear-gradient(135deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      border-radius: 0 4cqw 0 4cqw;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* 選單介面 */
    #menu-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 100;
      position: absolute;
      top: 0;
      left: 0;
    }

    .menu-inner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .menu-title {
      font-size: 3.5cqw;
      color: var(--text-blue);
      margin-bottom: 0.5cqw;
      font-weight: bold;
      text-align: center;
      line-height: 1.2;
    }

    .menu-subtitle {
      font-size: 1.8cqw;
      color: #555;
      margin-bottom: 2.5cqw;
      font-weight: bold;
      text-align: center;
    }

    .menu-row {
      display: flex;
      gap: 3cqw;
      margin-bottom: 1.5cqw;
    }

    .direction-group {
      background: white;
      padding: 2cqw;
      border-radius: 1cqw;
      box-shadow: 0 0.4cqw 1.5cqw rgba(0,0,0,0.1);
      text-align: center;
    }

    .dir-title {
      font-size: 1.8cqw;
      color: #333;
      margin-bottom: 1.5cqw;
      font-weight: bold;
      border-bottom: 0.2cqw solid var(--ctb-blue-bg);
      padding-bottom: 0.5cqw;
    }

    .btn-platform {
      display: block;
      width: 100%;
      padding: 1cqw 2cqw;
      margin-bottom: 1cqw;
      font-size: 1.2cqw;
      font-weight: bold;
      color: white;
      background: var(--ctb-blue-bg);
      border: none;
      border-radius: 0.5cqw;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-platform:hover { background: #002299; }

    /* 清除快取迷你按鍵 */
    .btn-clear-cache {
      position: absolute;
      bottom: 1.5cqw;
      padding: 0.6cqw 1.2cqw;
      font-size: 1.1cqw;
      color: #666;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 0.5cqw;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear-cache:hover {
      background: rgba(0, 0, 0, 0.1);
      color: #333;
    }

    /* PIDS 主體介面 */
    #pids-container {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      position: relative;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      grid-auto-flow: column;
      padding: 1.5cqw 0;
      height: 100%;
    }

    .grid-item {
      display: flex;
      align-items: center;
      padding: 0 3cqw;
      border-right: 0.1cqw solid rgba(0, 51, 153, 0.1);
      border-bottom: 0.1cqw solid rgba(0, 51, 153, 0.1);
    }
    .grid-item:nth-child(n+5) { border-right: none; }
    .grid-item:nth-child(4n) { border-bottom: none; }

    .route-box {
      background: var(--route-bg);
      color: white;
      font-family: 'Roboto', sans-serif;
      font-size: 5cqw;
      font-weight: bold;
      padding: 0.5cqw 2cqw;
      border-radius: 0.8cqw;
      min-width: 12cqw;
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.1cqw;
    }

    .eta-section {
      display: flex;
      align-items: center;
      margin-left: 1cqw;
      flex: 1;
    }

    .gps-icon {
      width: 1.6cqw;
      height: 1.6cqw;
      margin-left: 0.5cqw;
      margin-right: 0.8cqw;
      margin-bottom: 3.5cqw; 
      color: var(--gps-orange);
      opacity: 0;
    }
    .gps-icon.active { opacity: 1; }

    .eta-number {
      font-family: 'Roboto', sans-serif;
      font-size: 6.5cqw;
      font-weight: bold;
      color: var(--text-blue);
      line-height: 1;
      width: 7cqw;
      text-align: right;
    }

    .eta-text {
      display: flex;
      flex-direction: column;
      margin-left: 2.5cqw;
      color: #111111;
      font-size: 1.1cqw;
      font-weight: bold;
      line-height: 1.2;
    }

    .arriving-text {
      display: flex;
      flex-direction: column;
      color: var(--text-blue);
      font-size: 1.8cqw;
      font-weight: bold;
      line-height: 1.2;
      margin-left: 1.5cqw;
    }

    /* 載入遮罩層與進度條 */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .loading-text {
      font-size: 2.5cqw;
      color: var(--text-blue);
      font-weight: bold;
      text-align: center;
      margin-bottom: 2cqw;
      line-height: 1.3;
    }

    .progress-container {
      width: 50cqw;
      height: 1.5cqw;
      background-color: rgba(0, 51, 153, 0.15);
      border-radius: 1cqw;
      overflow: hidden;
      border: 0.2cqw solid var(--text-blue);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: var(--text-blue);
      transition: width 0.3s ease;
    }

    /* 暫無班次訊息 */
    .status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5cqw;
      color: var(--text-blue);
      font-weight: bold;
      text-align: center;
      width: 100%;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <!-- 啟動選單 -->
    <div id="menu-container">
      <div class="header"></div> <!-- 頂部留空對齊 -->
      
      <div class="panel-content menu-inner">
        <div class="menu-title">
          香港仔隧道巴士轉乘站PIDS 系統<br>
          <span style="font-size: 2.2cqw;">Aberdeen Tunnel BBI PIDS System</span>
        </div>
        <div class="menu-subtitle">↓ 請選擇月台 Please select a platform ↓</div>
        
        <div class="menu-row">
          <!-- 北行 -->
          <div class="direction-group">
            <div class="dir-title">北行 - 往港島北及九龍</div>
            <button class="btn-platform" onclick="startSystem('N', 'A')">月台 A (107, 170, 171, 671 等)</button>
            <button class="btn-platform" onclick="startSystem('N', 'B')">月台 B (6X, 37A, 70, 90, 260 等)</button>
            <button class="btn-platform" onclick="startSystem('N', 'C')">月台 C (38, 42, 65, 72, 77, 592 等)</button>
          </div>
          <!-- 南行 -->
          <div class="direction-group">
            <div class="dir-title">南行 - 往港島南</div>
            <button class="btn-platform" onclick="startSystem('S', 'A')">月台 A (6A, 6X, 65, 260)</button>
            <button class="btn-platform" onclick="startSystem('S', 'B')">月台 B (72A, 75, 90, 97, 171, 592 等)</button>
            <button class="btn-platform" onclick="startSystem('S', 'C')">月台 C (37B, 38, 42, 70, 72, 107 等)</button>
          </div>
        </div>
        <div style="font-size: 1.1cqw; color: #666; margin-top: 1cqw;">* 雙擊 PIDS 頂部藍色標題列可返回此選單</div>
        
        <!-- 迷你獨立清除快取按鈕 -->
        <button class="btn-clear-cache" onclick="clearCacheAndReload(event)">⟳ 清除系統快取 Clear Cache</button>
      </div>
      
      <div class="empty-ticker"></div> <!-- 底部留空對齊 -->
    </div>

    <!-- PIDS 顯示屏 -->
    <div id="pids-container" ondblclick="toggleFullScreen()">
      <div class="header" id="header-text" ondblclick="backToMenu()">月台 Platform</div>
      
      <!-- 中間漸層面板 -->
      <div class="panel-content">
        <div class="grid-container" id="grid-container"></div>
        
        <!-- 系統載入與進度條 -->
        <div id="loading-overlay">
          <div class="loading-text">系統載入中...<br>System Loading...</div>
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>

        <!-- 暫無班次訊息 -->
        <div class="status-msg" id="no-departures-msg"></div>
      </div>
      
      <div class="empty-ticker"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://rt.data.gov.hk/v1/transport/citybus-nwfb";
    const ITEMS_PER_PAGE = 8;
    
    const GPS_SVG = `<svg class="gps-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><g transform="rotate(25 12 12)"><path d="M4 12a8 8 0 0 1 8 8" /><path d="M4 4a16 16 0 0 1 16 16" /></g></svg>`;

    const PLATFORM_ROUTES = {
      "N": {
        "A": ["107", "107P", "170", "171", "171A", "171P", "671", "671X", "N170", "N171"],
        "B": ["6X", "37A", "70", "70P", "75", "90", "90C", "97", "260", "N90"],
        "C": ["38", "42", "42C", "65", "72", "72A", "77", "77X", "99", "99X", "592", "770", "N72"]
      },
      "S": {
        "A": ["6A", "6X", "65", "260"],
        "B": ["72A", "75", "90", "97", "99", "171", "592", "671", "N90", "N171"],
        "C": ["37B", "37X", "38", "42", "42C", "49X", "70", "70P", "72", "77", "107", "107P", "170", "770", "N72", "N170"]
      }
    };

    const DIR_KEYWORDS = {
      "N": ["銅鑼灣", "北角", "筲箕灣", "柴灣", "灣仔", "金鐘", "中環", "上環", "九龍", "新界", "深水埗", "觀塘", "荔枝角", "鑽石山", "沙田", "旺角"],
      "S": ["黃竹坑", "深水灣", "淺水灣", "赤柱", "鴨脷洲", "香港仔", "華富", "置富", "海怡半島", "利東", "田灣", "石排灣"]
    };

    let currentConfig = null; 
    let routeStopMap = {};
    let currentRoutes = [];
    let activeDepartures = [];
    let currentPage = 0;
    let isFetching = false;
    let refreshTimer = null;
    let pageTimer = null;

    async function startSystem(dir, plat) {
      document.getElementById('menu-container').style.display = 'none';
      document.getElementById('pids-container').style.display = 'flex';
      // 移除文字提示
      document.getElementById('header-text').innerHTML = `月台${plat} Platform ${plat}`;
      
      currentConfig = { dir, plat };
      currentRoutes = PLATFORM_ROUTES[dir][plat];
      
      await initBBIStopFinder();
      fetchLiveETAs();

      refreshTimer = setInterval(fetchLiveETAs, 15000);
      pageTimer = setInterval(() => {
        if (activeDepartures.length > ITEMS_PER_PAGE) {
          currentPage++;
          renderPage();
        }
      }, 8000);
    }

    function backToMenu() {
      clearInterval(refreshTimer);
      clearInterval(pageTimer);
      routeStopMap = {};
      activeDepartures = [];
      document.getElementById('grid-container').querySelectorAll('.grid-item').forEach(e => e.remove());
      document.getElementById('pids-container').style.display = 'none';
      document.getElementById('menu-container').style.display = 'flex';
    }

    function clearCacheAndReload(e) {
      e.stopPropagation();
      if(confirm("即將清除隧道轉車站的站位快取並重新載入，確定嗎？")) {
        for(let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if(key && key.startsWith("CTB_ABT_")) {
                localStorage.removeItem(key);
            }
        }
        alert("快取已清除！");
        location.reload();
      }
    }

    async function initBBIStopFinder() {
      const cacheKey = `CTB_ABT_${currentConfig.dir}_${currentConfig.plat}_V1`;
      const cached = localStorage.getItem(cacheKey);

      if (cached) {
        try {
          const parsedMap = JSON.parse(cached);
          const isCacheValid = currentRoutes.every(route => parsedMap[route]);
          if (isCacheValid) {
            routeStopMap = parsedMap;
            return;
          }
        } catch (e) {
          console.error("Cache parsing error");
        }
      }

      const overlay = document.getElementById("loading-overlay");
      const pBar = document.getElementById("progress-bar");
      const noDepMsg = document.getElementById("no-departures-msg");
      
      noDepMsg.style.display = "none";
      overlay.style.display = "flex";
      pBar.style.width = "0%";

      routeStopMap = {};
      const keywords = DIR_KEYWORDS[currentConfig.dir];
      const totalRoutes = currentRoutes.length;
      let processedRoutes = 0;

      for (let route of currentRoutes) {
        let routeFound = false;
        for (let dir of ["outbound", "inbound"]) {
          if (routeFound) break;
          try {
            const rsRes = await fetch(`${API_BASE}/route-stop/CTB/${route}/${dir}`);
            if (!rsRes.ok) continue;
            const rsJson = await rsRes.json();
            const stops = rsJson.data || [];

            for (let s of stops) {
              const sRes = await fetch(`${API_BASE}/stop/${s.stop}`);
              if (!sRes.ok) continue;
              const sJson = await sRes.json();
              const sName = sJson.data?.name_tc || "";
              
              if (sName.includes("香港仔隧道") || sName.includes("Aberdeen Tunnel")) {
                const routeInfoRes = await fetch(`${API_BASE}/route/CTB/${route}`);
                const routeInfoJson = await routeInfoRes.json();
                const routeDest = (dir === "outbound") ? routeInfoJson.data?.dest_tc : routeInfoJson.data?.orig_tc;
                
                const isCorrectBound = keywords.some(kw => routeDest && routeDest.includes(kw));
                if (isCorrectBound) {
                  routeStopMap[route] = s.stop;
                  routeFound = true;
                  break; 
                }
              }
            }
          } catch(e) {}
        }
        
        if (!routeFound) {
          routeStopMap[route] = "NOT_FOUND";
        }
        
        processedRoutes++;
        pBar.style.width = `${(processedRoutes / totalRoutes) * 100}%`;
      }
      
      localStorage.setItem(cacheKey, JSON.stringify(routeStopMap));
      
      await new Promise(r => setTimeout(r, 400));
      overlay.style.display = "none";
    }

    async function fetchLiveETAs() {
      if (isFetching || Object.keys(routeStopMap).length === 0) return;
      isFetching = true;

      try {
        const results = [];
        
        for (const route of currentRoutes) {
          const stopId = routeStopMap[route];
          if (!stopId || stopId === "NOT_FOUND") continue;

          try {
            const res = await fetch(`${API_BASE}/eta/CTB/${stopId}/${route}`);
            if (res.ok) {
              const json = await res.json();
              const list = json.data || [];
              const baseTimestamp = json.data_timestamp ? new Date(json.data_timestamp) : new Date();

              let earliest = null;

              for (const item of list) {
                if (!item.eta) continue;

                const etaTime = new Date(item.eta);
                const diffMs = etaTime.getTime() - baseTimestamp.getTime();
                const diffMins = Math.ceil(diffMs / 60000);

                if (diffMins >= 0) {
                  const rmk = (item.rmk_tc || "").trim();
                  const isRealtime = rmk === "" || (!rmk.includes("預定") && !rmk.includes("原定"));
                  
                  const hasGpsIcon = isRealtime && (diffMins <= 20);

                  if (!earliest || diffMins < earliest.mins) {
                    earliest = {
                      route: route,
                      mins: diffMins,
                      hasGpsIcon: hasGpsIcon
                    };
                  }
                }
              }
              if (earliest) results.push(earliest);
            }
          } catch (e) {}
          await new Promise(r => setTimeout(r, 40)); 
        }

        activeDepartures = results.sort((a, b) => {
          return a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' });
        });
        
        renderPage();

      } catch (err) {
        console.error("ETA Fetch Error:", err);
      } finally {
        isFetching = false;
      }
    }

    function renderPage() {
      const container = document.getElementById("grid-container");
      const noDepMsg = document.getElementById("no-departures-msg");

      container.querySelectorAll('.grid-item').forEach(e => e.remove());

      if (activeDepartures.length === 0) {
        noDepMsg.style.display = "block";
        noDepMsg.innerHTML = "現時段暫無班次<br>No Departures";
        return;
      }
      
      noDepMsg.style.display = "none";
      
      const totalPages = Math.ceil(activeDepartures.length / ITEMS_PER_PAGE);
      if (currentPage >= totalPages) currentPage = 0;
      
      const startIndex = currentPage * ITEMS_PER_PAGE;
      const currentItems = activeDepartures.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      currentItems.forEach(item => {
        const cell = document.createElement("div");
        cell.className = "grid-item";

        let etaDisplay = '';
        if (item.mins <= 1) {
          etaDisplay = `
            <div class="arriving-text">
              <span>即將抵達</span>
              <span style="font-size: 1.2cqw;">Arriving</span>
            </div>
          `;
        } else {
          etaDisplay = `
            <span class="eta-number">${item.mins}</span>
            <div class="eta-text">
              <span>分鐘</span>
              <span>Mins</span>
            </div>
          `;
        }

        let gpsSvgCode = GPS_SVG.replace('class="gps-icon"', `class="gps-icon ${item.hasGpsIcon ? 'active' : ''}"`);

        cell.innerHTML = `
          <div class="route-box">${item.route}</div>
          <div class="eta-section">
            ${gpsSvgCode}
            ${etaDisplay}
          </div>
        `;
        container.appendChild(cell);
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
