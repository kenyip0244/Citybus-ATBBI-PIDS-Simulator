<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aberdeen Tunnel BBI PIDS Simulator</title>
  <style>
    :root {
      --ctb-blue-bg: #0033cc;
      --route-bg: #1a36e8;
      --bg-gradient-top: #dceafc;
      --bg-gradient-bottom: #f2f7ff;
      --text-blue: #003399;
      --gps-orange: #f27224;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Arial", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
    }

    /* 選單介面 */
    #menu-container {
      width: 100vw;
      height: 100vh;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      position: absolute;
    }

    .menu-title {
      font-size: 3vw;
      color: var(--text-blue);
      margin-bottom: 2vw;
      font-weight: bold;
    }

    .menu-row {
      display: flex;
      gap: 3vw;
      margin-bottom: 3vw;
    }

    .direction-group {
      background: white;
      padding: 2vw;
      border-radius: 1vw;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .dir-title {
      font-size: 1.8vw;
      color: #333;
      margin-bottom: 1.5vw;
      font-weight: bold;
      border-bottom: 2px solid var(--ctb-blue-bg);
      padding-bottom: 0.5vw;
    }

    .btn-platform {
      display: block;
      width: 100%;
      padding: 1vw 2vw;
      margin-bottom: 1vw;
      font-size: 1.5vw;
      font-weight: bold;
      color: white;
      background: var(--ctb-blue-bg);
      border: none;
      border-radius: 0.5vw;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-platform:hover { background: #002299; }

    /* PIDS 主體介面 */
    #pids-container {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      display: none;
      flex-direction: column;
      position: relative;
    }

    .header {
      height: 8%;
      background: var(--ctb-blue-bg);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 2vw;
      font-size: 1.8vw;
      font-weight: bold;
      cursor: pointer;
    }

    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      padding: 1vw 0;
    }

    .grid-item {
      display: flex;
      align-items: center;
      padding: 0 3vw;
      border-right: 1px solid rgba(0, 51, 153, 0.1);
      border-bottom: 1px solid rgba(0, 51, 153, 0.1);
    }
    .grid-item:nth-child(even) { border-right: none; }
    .grid-item:nth-last-child(-n+2) { border-bottom: none; }

    .route-box {
      background: var(--route-bg);
      color: white;
      font-size: 5vw;
      font-weight: bold;
      padding: 0.5vw 2vw;
      border-radius: 0.8vw;
      min-width: 12vw;
      text-align: center;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .eta-section {
      display: flex;
      align-items: center;
      margin-left: 2vw;
      flex: 1;
    }

    .gps-icon {
      width: 2vw;
      height: 2vw;
      margin-right: 1.5vw;
      fill: var(--gps-orange);
      opacity: 0;
    }
    .gps-icon.active { opacity: 1; }

    .eta-number {
      font-size: 6vw;
      font-weight: bold;
      color: var(--text-blue);
      line-height: 1;
    }

    .eta-text {
      display: flex;
      flex-direction: column;
      margin-left: 1vw;
      color: var(--text-blue);
      font-size: 1.2vw;
      font-weight: bold;
      line-height: 1.2;
    }

    .arriving-text {
      display: flex;
      flex-direction: column;
      color: var(--text-blue);
      font-size: 1.8vw;
      font-weight: bold;
      line-height: 1.2;
    }

    .status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5vw;
      color: var(--text-blue);
      font-weight: bold;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 啟動選單 -->
  <div id="menu-container">
    <div class="menu-title">香港仔隧道巴士轉乘站 PIDS 啟動面板</div>
    <div class="menu-row">
      <!-- 北行 -->
      <div class="direction-group">
        <div class="dir-title">北行 - 往港島北及九龍</div>
        <button class="btn-platform" onclick="startSystem('N', 'A')">月台 A (107, 170, 171 等)</button>
        <button class="btn-platform" onclick="startSystem('N', 'B')">月台 B (6X, 70, 90 等)</button>
        <button class="btn-platform" onclick="startSystem('N', 'C')">月台 C (38, 72, 592 等)</button>
      </div>
      <!-- 南行 -->
      <div class="direction-group">
        <div class="dir-title">南行 - 往港島南</div>
        <button class="btn-platform" onclick="startSystem('S', 'A')">月台 A (6A, 6X, 65 等)</button>
        <button class="btn-platform" onclick="startSystem('S', 'B')">月台 B (72A, 90, 592 等)</button>
        <button class="btn-platform" onclick="startSystem('S', 'C')">月台 C (38, 72, 770 等)</button>
      </div>
    </div>
    <div style="font-size: 1vw; color: #666;">* 雙擊 PIDS 頂部藍色標題列可返回此選單</div>
  </div>

  <!-- PIDS 顯示屏 -->
  <div id="pids-container" ondblclick="toggleFullScreen()">
    <div class="header" id="header-text" ondblclick="backToMenu(event)">月台 Platform</div>
    <div class="grid-container" id="grid-container"></div>
    <div class="status-msg" id="loadingMsg" style="display: none;"></div>
  </div>

  <script>
    const API_BASE = "https://rt.data.gov.hk/v1/transport/citybus-nwfb";
    const ITEMS_PER_PAGE = 8;
    
    // GPS SVG 圖示 (仿實體弧線設計)
    const GPS_SVG = `<svg class="gps-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm1-12C9.24 4 7 6.24 7 9h2c0-1.66 1.34-3 3-3s3 1.34 3 3c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.76-2.24-5-5-5z" opacity="0"/><path d="M4.01 10.32C5.55 7.15 8.5 5 12 5c3.5 0 6.45 2.15 8.01 5.32l1.79-1C19.83 5.4 16.21 3 12 3 7.79 3 4.17 5.4 2.22 9.32l1.79 1z"/><path d="M8.2 13.06C9.1 11.23 10.45 10 12 10c1.55 0 2.9.89 3.8 2.06l1.6-1.2C16.14 9.24 14.19 8 12 8c-2.19 0-4.14 1.24-5.4 2.86l1.6 1.2z"/></svg>`;

    // 官方通告之路線分配
    const PLATFORM_ROUTES = {
      "N": {
        "A": ["107", "107P", "170", "171", "171A", "171P", "671", "671X", "N170", "N171"],
        "B": ["6X", "37A", "70", "70P", "75", "90", "90C", "97", "260", "N90"],
        "C": ["38", "42", "42C", "65", "72", "72A", "77", "77X", "99", "99X", "592", "770", "N72"]
      },
      "S": {
        "A": ["6A", "6X", "65", "260"],
        "B": ["72A", "75", "90", "97", "99", "171", "592", "671", "N90", "N171"],
        "C": ["37B", "37X", "38", "42", "42C", "49X", "70", "70P", "72", "77", "107", "107P", "170", "770", "N72", "N170"]
      }
    };

    // 用於自動尋址引擎辨識方向的關鍵字
    const DIR_KEYWORDS = {
      "N": ["銅鑼灣", "北角", "筲箕灣", "柴灣", "灣仔", "金鐘", "中環", "上環", "九龍", "新界", "深水埗", "觀塘", "荔枝角", "鑽石山", "沙田", "旺角"],
      "S": ["黃竹坑", "深水灣", "淺水灣", "赤柱", "鴨脷洲", "香港仔", "華富", "置富", "海怡半島", "利東", "田灣", "石排灣"]
    };

    let currentConfig = null; // { dir, plat }
    let activeStopIds = new Set();
    let currentRoutes = [];
    let activeDepartures = [];
    let currentPage = 0;
    let isFetching = false;
    let refreshTimer = null;
    let pageTimer = null;

    async function startSystem(dir, plat) {
      document.getElementById('menu-container').style.display = 'none';
      document.getElementById('pids-container').style.display = 'flex';
      document.getElementById('header-text').innerHTML = `月台${plat} Platform ${plat}`;
      
      currentConfig = { dir, plat };
      currentRoutes = PLATFORM_ROUTES[dir][plat];
      
      await initBBIStopFinder();
      fetchLiveETAs();

      // 設定循環更新
      refreshTimer = setInterval(fetchLiveETAs, 15000);
      pageTimer = setInterval(() => {
        if (activeDepartures.length > ITEMS_PER_PAGE) {
          currentPage++;
          renderPage();
        }
      }, 8000);
    }

    function backToMenu(e) {
      e.stopPropagation(); // 避免觸發全螢幕
      clearInterval(refreshTimer);
      clearInterval(pageTimer);
      activeStopIds.clear();
      activeDepartures = [];
      document.getElementById('grid-container').innerHTML = '';
      document.getElementById('pids-container').style.display = 'none';
      document.getElementById('menu-container').style.display = 'flex';
    }

    // 自動尋址引擎：尋找新香港仔隧道轉車站的真實 Stop ID
    async function initBBIStopFinder() {
      const msgDiv = document.getElementById("loadingMsg");
      msgDiv.style.display = "block";
      msgDiv.innerHTML = "正在全自動掃描並綁定轉乘站月台資訊...<br>Auto-calibrating Interchange Stop IDs...";

      activeStopIds.clear();
      const keywords = DIR_KEYWORDS[currentConfig.dir];

      for (let route of currentRoutes) {
        for (let dir of ["outbound", "inbound"]) {
          try {
            const rsRes = await fetch(`${API_BASE}/route-stop/CTB/${route}/${dir}`);
            if (!rsRes.ok) continue;
            const rsJson = await rsRes.json();
            const stops = rsJson.data || [];

            for (let s of stops) {
              // 避免重複查詢已知 Stop ID
              if (activeStopIds.has(s.stop)) break; 

              const sRes = await fetch(`${API_BASE}/stop/${s.stop}`);
              if (!sRes.ok) continue;
              const sJson = await sRes.json();
              const sName = sJson.data?.name_tc || "";
              
              // 關鍵比對：站名包含「香港仔隧道」或「Aberdeen Tunnel」
              if (sName.includes("香港仔隧道") || sName.includes("Aberdeen Tunnel")) {
                // 再次驗證方向是否正確 (透過該路線終點站驗證)
                const routeInfoRes = await fetch(`${API_BASE}/route/CTB/${route}`);
                const routeInfoJson = await routeInfoRes.json();
                const routeDest = (dir === "outbound") ? routeInfoJson.data?.dest_tc : routeInfoJson.data?.orig_tc;
                
                const isCorrectBound = keywords.some(kw => routeDest && routeDest.includes(kw));
                if (isCorrectBound) {
                  activeStopIds.add(s.stop);
                  break; // 找到該路線正確方向的隧道站即可跳出
                }
              }
            }
          } catch(e) {}
        }
      }
      msgDiv.style.display = "none";
    }

    async function fetchLiveETAs() {
      if (isFetching || activeStopIds.size === 0) return;
      isFetching = true;

      try {
        const results = [];
        
        for (const stopId of activeStopIds) {
          for (const route of currentRoutes) {
            try {
              const res = await fetch(`${API_BASE}/eta/CTB/${stopId}/${route}`);
              if (res.ok) {
                const json = await res.json();
                const list = json.data || [];
                const baseTimestamp = json.data_timestamp ? new Date(json.data_timestamp) : new Date();

                let earliest = null;

                for (const item of list) {
                  if (!item.eta) continue;

                  const etaTime = new Date(item.eta);
                  const diffMs = etaTime.getTime() - baseTimestamp.getTime();
                  const diffMins = Math.ceil(diffMs / 60000);

                  if (diffMins >= 0) {
                    // 實時 GPS 判斷邏輯
                    const rmk = (item.rmk_tc || "").trim();
                    const hasGpsIcon = rmk === "" || (!rmk.includes("預定") && !rmk.includes("原定"));

                    if (!earliest || diffMins < earliest.mins) {
                      earliest = {
                        route: route,
                        mins: diffMins,
                        hasGpsIcon: hasGpsIcon
                      };
                    }
                  }
                }
                if (earliest) results.push(earliest);
              }
            } catch (e) {}
            await new Promise(r => setTimeout(r, 40)); // API Rate Limit 保護
          }
        }

        activeDepartures = results.sort((a, b) => a.mins - b.mins);
        renderPage();

      } catch (err) {
        console.error("ETA Fetch Error:", err);
      } finally {
        isFetching = false;
      }
    }

    function renderPage() {
      const container = document.getElementById("grid-container");
      const msgDiv = document.getElementById("loadingMsg");

      if (activeDepartures.length === 0) {
        container.innerHTML = "";
        msgDiv.style.display = "block";
        msgDiv.innerHTML = "現時段暫無班次<br>No Departures";
        return;
      }
      
      msgDiv.style.display = "none";
      container.innerHTML = "";
      
      const totalPages = Math.ceil(activeDepartures.length / ITEMS_PER_PAGE);
      if (currentPage >= totalPages) currentPage = 0;
      
      const startIndex = currentPage * ITEMS_PER_PAGE;
      const currentItems = activeDepartures.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      currentItems.forEach(item => {
        const cell = document.createElement("div");
        cell.className = "grid-item";

        // 動態判定抵達狀態
        let etaDisplay = '';
        if (item.mins <= 1) {
          etaDisplay = `
            <div class="arriving-text">
              <span>即將抵達</span>
              <span style="font-size: 1.2vw;">Arriving</span>
            </div>
          `;
        } else {
          etaDisplay = `
            <span class="eta-number">${item.mins}</span>
            <div class="eta-text">
              <span>分鐘</span>
              <span>Mins</span>
            </div>
          `;
        }

        // SVG 圖示替換並處理 Active 狀態
        let gpsSvgCode = GPS_SVG.replace('class="gps-icon"', `class="gps-icon ${item.hasGpsIcon ? 'active' : ''}"`);

        cell.innerHTML = `
          <div class="route-box">${item.route}</div>
          <div class="eta-section">
            ${gpsSvgCode}
            ${etaDisplay}
          </div>
        `;
        container.appendChild(cell);
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
